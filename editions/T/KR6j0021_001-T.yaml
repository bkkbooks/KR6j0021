body:
  text: 淨影寺比綺院五部持念僧惟謹述成入理軌儀一卷夫言阿闍梨者解祕中最祕真言智大心阿字名種子故一切如是依法皆遍受若於此教法解斯廣大智正覺大功德說名阿闍梨是即為如來亦即名為佛梵云汗㗚馱汗㗚馱者即是真實心即是阿字夫言阿字者即是一切諸佛之母是一切真言生處最為上妙佛心之字若言阿字內音即是喉中之音當知此阿字遍布一切支分即是本不生義梵有二音一名阿剎囉是根本字亦名不動義不動者是菩提心義如最初二音阿阿是根本字次從伊伊乃至污奧凡十二字皆是從生增加之字皆是女聲其根本字者是男聲男聲是慧義女聲是定義又解說有五聲阿字體聲阿字行聲伊伊至污奧凡十二字皆是三昧之聲暗字證三菩提之聲噁字是入大般涅槃之聲若見仰壤拏曩莽即同上點亦是證三菩提之聲若見野囉等八字即同傍點亦是大般涅槃之聲其根本字遍一切處增加字亦遍一切處根本增加不相異也皆以根本字體本而傍角加畫是故根本增加不一不異猶如器中盛水因器持水水不離器如是更相依持能遍內外非但阿字遍一切處次從迦佉誐伽仰乃至乞灑二合字亦遍一切處何以故皆是根本之音其根本音者即是阿字又如迦字各各自有從生增加之字如迦字中即有計蓋之字皆是女聲緣迦字體上加畫則成增加之字體是慧義而加是定慧相持合而為一其體不失止觀雙行亦遍一切處所以增加遍於根本根本遍於增加從生遍於種子種子遍於從生所以梵云鄔婆縛亦名發起猶如種子生果果還成種今此阿字即同種子能生多果一一復生百千萬倍乃至展轉無量不可說也然見子識果因既如此當知果必如之今此阿字亦如是也從此根本無師自然之智一切智業從此而生布諸支分布支分者即是自心由此自心即攝一切身分離心無身離身無心亦同於阿字若遍布此字者即同諸佛謂從字有果即是佛能證正知故名為正覺猶識此字之理性者故得如來名此字之性理者謂此阿字即是本不生義又如人有心能遍支分皆受苦樂阿字亦遍一切支分即是心本不生義阿字遍一切字若一切字無阿字即字不成要有阿字若字無頭即不成字故以阿字為頭從一阿字音凡一切諸聲中皆有阿字之音不得此阿字音者從字音表而得有聲生以有聲生以有聲故遍於支分能表一切世間出世間之法若但見其字音則能詮表於理又要音韻語言牙齒𩫋𮂕得有所表謂青黃赤白東西南北方圓大小上下尊卑一切事類方可領解故經云祕密主此是遍一切處法門又華嚴經云如是字母能於一切世出世間善巧之法以智通達到於彼岸殊方異藝成綜無遺文字算數蘊其深解醫方呪術善療眾病有諸眾生鬼魅所持怨憎呪詛惡星變怪死屍奔逐癲癎羸瘦種種諸疾咸能救之使得痊愈又善別知金玉珠貝珊瑚琉璃摩尼車璖雞薩羅等一切寶藏出生之處品類不同價直多少村營鄉邑大小都城宮殿苑園巖泉籔澤凡是一切人眾所居菩薩或能隨方攝護又善觀察天文地理人相吉凶鳥獸音聲雲霞氣候年穀豐儉國土安危如是世間所有技藝莫不該練盡其源本又所以經云祕密主故以阿字為頭阿字即是真言之心佛心之字上來所說阿闍梨住於佛地義猶未了即是此中住阿字觀門此阿字者亦名奢摩他亦名毘鉢舍那之智亦名真寶之智亦名一切智智所以經云一切智根本智智後得智從後得智起大悲從大悲起三種化身夫阿闍梨若觀此字而相應者即是自身同於毘盧遮那佛身亦名金剛不壞之身亦名普現色身亦名三種意生身阿闍梨謂觀此阿字之輪猶如孔雀尾輪光明圍遶行者而住其中即是住於佛位是故清淨法界圓鏡中現出阿字所以從阿字旋轉出生諸字即遍一切真言名字之中周旋往返百千萬倍入諸旋陀羅尼門總持無礙所以從阿字旋轉出生三身四智而轉法輪若行者為人作阿闍梨者先須建立大悲胎藏曼荼羅王住於佛位以此諸字合集成身即住佛位然布字之時分為四重每重皆有三種歸命頭為初分咽為二分心為三分臍為四分阿阿暗噁迦迦劍脚佉佉欠却誐誐儼虐伽伽儉唬遮遮占灼車車綽若若染弱社社瞻杓吒吒𪉜磔𡛥𡛥𭌂坼拏拏喃搦荼荼湛釋哆多擔怛他他探託娜娜腩諾馱馱淡鐸跛波啶博頗頗𭈠泊摩摩𤚥莫婆婆𭊃薄野野閻藥欏邏攬落嚩嚩鑁嚩奢奢睒鑠沙沙釤嗦娑娑糝索訶訶頷臛乞灑乞叉乞懺乞嗦伊縊𢞬烏哩𭊂里𭊂翳藹污奧仰攘拏曩莽𠵫攘儜囊忙噞𮣾喃南鑁弱搦諾莫凡布字之法當從行者眉間白毫而觀迦字右旋逐曰而轉令環相接四重亦復如是一一合集成身所以經云迦左吒哆跛初中後相加以等持品類相入自然獲得菩提心行成等正覺及般涅槃即是初阿阿暗噁四重之義又迦左吒哆跢等二十字即是中義其伊伊至污奧凡十二字即是加以等持品類之義又仰壤拏曩莽至弱搦諾莫等二十字即是後相義故總而言之相入自然又解分為三分頭為初分黃色咽心為中分白色臍為後分黑色若用迦字為輪即不用劍字若用劍字為輪即不用迦字斯謂發菩提心行果為中大寂為後是名三分阿闍梨既如是三重成身已其曼荼羅并及弟子亦如是布之三事皆成是名祕密曼荼羅若不了達此中意趣難依前事法而作不名善作虛費其功夫亦無所成也又此布字之法即是大悲胎藏三重祕密曼荼羅自非人集真明之行堪傳授者方以意想傳之不可文載故師已口相授經云但言字輪品其伊伊至污奧凡十二字皆在字輪外散布由光焰又仰壤𠸎曩莽噞𮣾喃南鑁㖸弱搦謨莫凡五字隨三輪而轉相入自然今此輪者即是三轉法輪之義行者相應如是布字持念即是持明之身猶如大日如來神力加持等無有異此輪亦名因緣輪師及弟子并曼荼羅皆如是安布諸字亦名祕密之輪此諸字亦是一切佛心之字亦名真言之輪輪者梵音名阿剎囉輪阿剎囉輪者謂從一阿字輪生多字故名為輪阿字即是菩提體性如摩訶毘盧遮那住於菩提心體性種種示現普門利益種種變現無量無邊雖如是垂跡無窮然實常住不動亦無起滅猶如車輪雖復運轉無窮而中未曾動搖由不動故能制群機動而無動即是阿字本不生義以無生無滅即無動無退而生一切字輪輪無窮是名不動之輪阿闍梨若能如是了達不動之輪而布諸字其體自然身有所表無非密印口有所說皆是真言意常止住無非觀門凡有見聞觸知之者皆必定於無上菩提所成福利真實不虛若能如是即同毘盧遮那如來而作佛事常照世間阿闍梨若持念時或觀句輪句輪者觀本尊心有圓明而布真言之字輪轉相接明了現前觀此字輪猶如白乳次第流注入行者口中或注其頂相續不絕遍滿其身其圓明中有種子字字常明了猶如流水無盡如是持誦疲極已即但住於寂心阿字又言三洛叉數者也即是三十萬遍若行者又得見本尊種子印等即從本尊種子印中而見本尊如是成就已即能遍安布諸字而成自體即如實知自心成遍照之身是名洛叉之義若不如是相應者於百年中念滿千萬洛叉猶不得成何況三洛叉耶若行者三相平等一身實相是一洛叉除一切身垢二語實相是二落叉除一切語垢三意實相除一切心垢三垢除已三功德生分證如來功德如是業相應住菩提心戒一切地波羅蜜悉皆圓滿隨所住法教皆依明禁故隨所願成果常當於自他悲愍而救護經云祕密主白佛言云何如來應供正遍知得一切智智廣演分布種種道演說一切智智各各同彼言音住種種威儀一切智智道一味世尊譬如地水火風空自性遍一切處皆不出阿字之門所以金剛手問大日如來如是智慧以何為因云何為根云何究竟耶佛告金剛手菩提心為因悲為根方便為究竟祕密主云何菩提謂如實知自心即是阿字一相亦非一亦非異又經云諦聽金剛手今說修行曼荼羅行滿足一切智智法門所以萬行圓極無可復增應物之權究盡能事即醍醐妙果三密之源智彼最真實得名阿闍梨故應具方便了知佛所說故經云復次祕密主諸佛所宣說安布諸字門佛子一心聽迦字在咽下佉字在腭上誐字以為頸伽字在喉中遮字為舌根車字在舌中若字為舌端社字舌生處吒字以為脛咤字應知髀拏字說為腰荼字以安坐多字最後分他字應知腹娜字為二手馱安名為脇波字以為背頗字應知胸摩字為一肘婆字次臂下莽字住於心野字陰藏相囉字名為眼邏字為廣額縊伊在二眦塢烏為二脣翳愛為二耳污奧為二頰暗字菩提句噁字般涅槃知是一切法行者成正覺一切智資財常在於其心世號一切智是為薩婆若依胎藏毘盧遮那經略集字母觀行儀一本巨唐開元年三月中旬五部持念惟謹集應德二年十一月二日於南勝房以前唐院本書仁豪此一帖奉傳授二品親王畢公助右如奧書令傳受畢二品尊鎮親王
